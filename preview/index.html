<!doctype html>
<html lang="zh-CN" data-preview="boot">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dsh-deepseek-ocean · preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
  body { font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; color: #e8edf3; }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; background: #000; }
  #hud {
    display: none;
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 2;
    padding: 10px 14px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(4, 6, 9, 0.72);
    letter-spacing: 0.02em;
    font-size: 11px;
    line-height: 1.7;
    white-space: pre;
    pointer-events: none;
    border-radius: 2px;
  }
  #hud.on { display: block; }
  #hud .title { color: #fff; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  #hud .dim { color: #8a929c; }
  #error {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 3;
    margin: 0;
    padding: 24px;
    background: #000;
    color: #ff8a8a;
    font: 12px/1.6 ui-monospace, Consolas, monospace;
    white-space: pre-wrap;
    overflow: auto;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hud" role="status"></div>
<pre id="error"></pre>

<script>
/*
 * 1. Fake the DSH client module loader.
 *
 * lib/client.js is a browser module: it calls
 * window.__ModuleLoader__.load({ id, factory }) at parse time and exports its
 * internals from the factory. The real client supplies the loader and a React
 * runtime; this harness supplies both so the renderer can be driven directly
 * without booting the DSH UI.
 */
(function () {
  "use strict";

  const react = {
    Fragment: Symbol.for("react.fragment"),
    createElement(type, props) {
      return { type: type, props: props || {}, children: Array.prototype.slice.call(arguments, 2) };
    },
    useEffect() {},
    useLayoutEffect() {},
    useMemo(factory) { return factory(); },
    useCallback(fn) { return fn; },
    useRef(value) { return { current: value === undefined ? null : value }; },
    useState(initial) {
      const value = typeof initial === "function" ? initial() : initial;
      return [value, function () {}];
    },
  };

  const state = (window.__OCEAN_PREVIEW__ = {
    moduleId: null,
    exports: null,
    loaderCalls: 0,
    error: null,
  });
  window.__OCEAN_REACT__ = react;

  window.__ModuleLoader__ = {
    load(entry) {
      if (!entry || typeof entry.factory !== "function") {
        throw new Error("preview loader: load() expects { id, factory }");
      }
      state.loaderCalls += 1;
      state.moduleId = entry.id || null;
      state.entry = entry;
      const require = (name) => {
        if (name === "react") return react;
        throw new Error('preview loader: unsupported require("' + name + '")');
      };
      state.exports = entry.factory(require);
      return state.exports;
    },
  };
})();
</script>

<script src="./presets.js"></script>
<script src="./overlay.js"></script>
<script src="../lib/client.js"></script>

<script>
/*
 * 2. Preview runtime: deterministic frame -> one screenshot.
 *
 * Query parameters (all optional):
 *   preset  style preset name, or an inline JSON settings patch
 *   seed    PRNG seed, deterministic fish/shark placement
 *   frames  simulated 1/60 s steps before the frame is captured (default 240)
 *   panel   1 to show the preview HUD
 *   dpr     device pixel ratio override for the canvas backing store
 *   size    WxH, informational only (the canvas follows the viewport)
 */
(function () {
  "use strict";

  const state = window.__OCEAN_PREVIEW__;
  const params = new URLSearchParams(window.location.search);
  const canvas = document.getElementById("stage");
  const hud = document.getElementById("hud");
  const errorBox = document.getElementById("error");
  const html = document.documentElement;

  function fail(err) {
    const text = err && err.stack ? err.stack : String(err);
    state.error = text;
    html.dataset.preview = "error";
    errorBox.textContent = "PREVIEW ERROR\n\n" + text;
    errorBox.style.display = "block";
    window.__PREVIEW_READY = true;
  }

  function numberParam(name, fallback, lo, hi) {
    const raw = params.get(name);
    const value = raw === null ? fallback : Number(raw);
    if (!Number.isFinite(value)) throw new Error('preview: "' + name + '" must be a number, got ' + raw);
    return Math.min(hi, Math.max(lo, Math.round(value)));
  }

  /** Small deterministic PRNG so baseline shots are reproducible. */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function presetTable() {
    const table = Object.assign({}, window.__OCEAN_PRESETS__ || {});
    const mod = state.exports || {};
    if (mod.PRESETS && typeof mod.PRESETS === "object") Object.assign(table, mod.PRESETS);
    if (mod.presets && typeof mod.presets === "object") Object.assign(table, mod.presets);
    return table;
  }

  function resolvePreset(name) {
    const trimmed = String(name || "").trim();
    if (!trimmed || trimmed === "default" || trimmed === "none") return {};
    if (trimmed.charAt(0) === "{") {
      const parsed = JSON.parse(trimmed);
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
        throw new Error("preview: inline preset JSON must be an object");
      }
      return parsed;
    }
    const table = presetTable();
    if (Object.prototype.hasOwnProperty.call(table, trimmed)) {
      const value = table[trimmed];
      return typeof value === "function" ? value() : value;
    }
    const mod = state.exports || {};
    for (const key of ["resolvePreset", "preset"]) {
      if (typeof mod[key] === "function") {
        const value = mod[key](trimmed);
        if (value && typeof value === "object") return value;
      }
    }
    throw new Error('preview: unknown preset "' + trimmed + '". known: ' + Object.keys(table).join(", "));
  }

  function applyPreset(engine, name, patch) {
    const mod = state.exports || {};
    if (typeof engine.applyPreset === "function") return engine.applyPreset(name, patch);
    if (typeof engine.setPreset === "function") return engine.setPreset(name, patch);
    if (typeof mod.applyPreset === "function") return mod.applyPreset(engine, name, patch);

    const settings = Object.assign({}, patch);
    const sharks = settings.sharks;
    delete settings.sharks;
    engine.setSettings(settings);
    if (Array.isArray(sharks) && typeof mod.World === "function") {
      engine.world = new mod.World(sharks);
      engine.resize();
    }
    return engine.settings;
  }

  function hudLine(label, value, dim) {
    const line = document.createElement("div");
    if (dim) line.className = "dim";
    line.textContent = label + " " + value;
    return line;
  }

  try {
    if (!state.exports) throw new Error("lib/client.js did not register with window.__ModuleLoader__");
    const mod = state.exports;
    const OceanEngine = mod.OceanEngine;
    if (typeof OceanEngine !== "function") throw new Error("lib/client.js does not export OceanEngine");

    const width = Math.max(1, Math.round(window.innerWidth));
    const height = Math.max(1, Math.round(window.innerHeight));
    const dpr = numberParam("dpr", Math.min(window.devicePixelRatio || 1, 2), 0.5, 4);
    const presetName = params.get("preset") || "default";
    const panel = params.get("panel") === "1";
    const frames = numberParam("frames", 240, 0, 5000);
    const seed = numberParam("seed", 20260101, 0, 0xffffffff);

    const patch = resolvePreset(presetName);

    const nativeRandom = Math.random;
    Math.random = mulberry32(seed);
    let engine;
    let renderer;
    let elapsedMs = 0;
    try {
      engine = new OceanEngine(canvas, { fadeIn: false });
      engine.resize();
      applyPreset(engine, presetName, patch);
      engine.resize();

      renderer = engine.renderer;
      renderer.world = engine.world;
      canvas.style.opacity = "1";

      const started = performance.now();
      const dt = 1 / 60;
      for (let i = 0; i < frames; i += 1) {
        engine.world.step(dt);
        renderer.world = engine.world;
        renderer.render(engine.world, dt);
      }
      if (frames === 0) renderer.render(engine.world, dt);
      const meta = (window.__OCEAN_PRESET_META__ || {})[presetName] || {};
      const techEnabled = !!(meta.tech && params.get("tech") !== "0");
      if (window.__OCEAN_OVERLAY__) {
        window.__OCEAN_OVERLAY__.draw(renderer.ctx, width, height, meta, { tech: techEnabled });
      }
      elapsedMs = performance.now() - started;
      if (meta) window.__OCEAN_PREVIEW_META__ = meta;
    } finally {
      Math.random = nativeRandom;
    }

    const info = {
      width: width,
      height: height,
      dpr: dpr,
      preset: presetName,
      seed: seed,
      frames: frames,
      tech: !!(window.__OCEAN_PREVIEW_META__ && window.__OCEAN_PREVIEW_META__.tech && params.get("tech") !== "0"),
      moduleId: state.moduleId,
      cols: renderer.cols,
      rows: renderer.rows,
      sharks: engine.world.sharks.length,
      fish: engine.world.fish.length,
      elapsedMs: Math.round(elapsedMs),
    };

    hud.append(
      (function () {
        const line = document.createElement("div");
        line.className = "title";
        line.textContent = "deepseek-ocean · preview";
        return line;
      })(),
      hudLine("viewport", info.width + "\u00d7" + info.height + " @" + dpr + "x"),
      hudLine("preset", presetName + (info.tech ? " · tech" : "")),
      hudLine("seed", String(seed) + " · frames " + frames),
      hudLine("module", String(info.moduleId || "?")),
      hudLine("grid", info.cols + "\u00d7" + info.rows + " cells"),
      hudLine("sharks", String(info.sharks) + " · fish " + info.fish),
      hudLine("render", info.elapsedMs + " ms", true)
    );
    if (panel) {
      hud.classList.add("on");
      if (typeof mod.mountPreviewPanel === "function") {
        try {
          mod.mountPreviewPanel(engine, { hud: hud, params: params, state: state, info: info });
        } catch (err) {
          console.warn("preview: mountPreviewPanel failed", err);
        }
      }
    }

    // A pending ResizeObserver callback would resize (and clear) the canvas
    // after this script returns, leaving the screenshot blank. Detach the
    // engine once the frame and the optional panel are in place.
    if (params.get("live") === "1") {
      engine.start();
    } else if (engine && typeof engine.destroy === "function") engine.destroy();
    state.engine = engine;

    window.__PREVIEW_INFO__ = info;
    html.dataset.preview = "ready";
    window.__PREVIEW_READY = true;
  } catch (err) {
    fail(err);
  }
})();
</script>
</body>
</html>
